<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin: Vocabulary Editor - AyoSinau</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#2563eb",
                        "background-light": "#f8fafc",
                        "background-dark": "#0f172a",
                        "card-light": "#ffffff",
                        "card-dark": "#1e293b",
                        border: "#e2e8f0",
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                        'lg': '0.75rem',
                        'xl': '1rem',
                    },
                },
            },
        };
    </script>
<style type="text/tailwindcss">
        .batik-overlay {
            background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuBS0vmTqjVKiUU9F-3XFzHechu28bWqaIscCfKd0Siawc71psE8BujZoyGAkTRwuMeBjdiQo4vrydbaFgTd1amInw4OKEVNM3uMwdhwcwrogCx67pbL-hM4t_uAW2bbavW6aqFYiXaH6vl-DQzwAZL5fzz6fRRRnHOwV7wTTeQw6ejsYmUedIvotE6IIK-Huq-1ivOPqgJ_YXwjBSqMPEZpK9YwFVJWxCGq0lbF_0we6p3pcjZBl7YdGSnV5WI9Yi1beUsC19aiGpg);
            background-repeat: repeat;
            opacity: 0.03;
            pointer-events: none;
        }
        .dark .batik-overlay {
            background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuBs8DWkuaDwlorQkn3W8gxmC22HF1EGq1McAxOXOk0_zjLK3JGPrwm0ThXBTVa-Et1AN3UfDYjc_tCRWWHUcUMiBCXJe-V3we3CAu7Kqi7g2o5Tgs8sfUfhYejr_XJ-I94U1H0kT2CiawTAdBS4AcopO4nhqrHVge2OtIEU-WdIyEZS-rZsswKmeU41-rIz34BoC7Ne5RC6D-d0gijZFu-B9fFaAky3y-Zu7N6p9OfJ2p0JWb0dD5_flQ65HMQEWwVNO4urfKPxGCY);
            opacity: 0.05;
        }
        body {
            font-family: "Inter", sans-serif;
        }
        .shadcn-input {
            @apply flex h-10 w-full rounded-md border border-slate-200 bg-white px-3 py-2 text-sm ring-offset-white file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-slate-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 dark:border-slate-800 dark:bg-slate-950 dark:ring-offset-slate-950 dark:placeholder:text-slate-400 dark:focus-visible:ring-slate-300;
        }
        .shadcn-textarea {
            @apply flex min-h-[80px] w-full rounded-md border border-slate-200 bg-white px-3 py-2 text-sm ring-offset-white placeholder:text-slate-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 dark:border-slate-800 dark:bg-slate-950 dark:ring-offset-slate-950 dark:placeholder:text-slate-400 dark:focus-visible:ring-slate-300;
        }
        .label-sm {
            @apply text-xs font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 text-slate-700 dark:text-slate-300 mb-2 block;
        }
    </style>
</head>
<body class="bg-[#f1f5f9] dark:bg-background-dark min-h-screen flex items-center justify-center p-6">
<div class="fixed inset-0 bg-slate-900/20 backdrop-blur-[2px] z-0"></div>
<div class="relative z-10 w-full max-w-5xl bg-white dark:bg-slate-950 rounded-lg shadow-xl overflow-hidden border border-slate-200 dark:border-slate-800 flex flex-col max-h-[92vh]">
<div class="absolute inset-0 batik-overlay"></div>
<div class="relative p-6 flex justify-between items-center border-b border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-950">
<div>
<h1 class="text-xl font-semibold tracking-tight text-slate-900 dark:text-white">Update Dictionary Entry</h1>
<p class="text-sm text-slate-500 dark:text-slate-400">Refine linguistic details and contextual examples for the database.</p>
</div>
<button class="h-8 w-8 flex items-center justify-center rounded-md text-slate-400 hover:bg-slate-100 hover:text-slate-600 dark:hover:bg-slate-800 dark:hover:text-slate-200 transition-all">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<div class="relative flex-1 overflow-y-auto p-8">
<div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
<div class="space-y-6">
<div class="flex items-center gap-2 pb-2 border-b border-slate-100 dark:border-slate-800">
<span class="material-symbols-outlined text-blue-600 text-[20px]">translate</span>
<h2 class="text-sm font-semibold text-slate-900 dark:text-white uppercase tracking-wider">Core Linguistics</h2>
</div>
<div class="space-y-4">
<div class="space-y-1.5">
<label class="label-sm">Javanese Word</label>
<input class="shadcn-input h-12 text-base font-medium" type="text" value="sewengi muput"/>
</div>
<div class="space-y-1.5">
<label class="label-sm">Dutch Translation</label>
<input class="shadcn-input h-11" type="text" value="de hele nacht lang"/>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="label-sm">Phonetic</label>
<input class="shadcn-input" placeholder="/phonetic/" type="text"/>
</div>
<div class="space-y-1.5">
<label class="label-sm">Formality</label>
<select class="shadcn-input">
<option>Ngoko</option>
<option>Krama Alus</option>
<option>Krama Inggil</option>
</select>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="label-sm">Level</label>
<select class="shadcn-input">
<option>A1 - Beginner</option>
<option>A2 - Elementary</option>
<option>B1 - Intermediate</option>
</select>
</div>
<div class="space-y-1.5">
<label class="label-sm">Category</label>
<select class="shadcn-input">
<option>Time &amp; Duration</option>
<option>Action</option>
<option>Object</option>
</select>
</div>
</div>
<div class="space-y-1.5">
<label class="label-sm">Audio Source</label>
<div class="relative">
<input class="shadcn-input pr-10" type="text" value="/audio/uploads/sewengi_muput.mp3"/>
<button class="absolute right-2 top-1/2 -translate-y-1/2 text-blue-600 hover:text-blue-700">
<span class="material-symbols-outlined text-[20px]">play_circle</span>
</button>
</div>
</div>
<div class="space-y-1.5">
<label class="label-sm">Tags</label>
<input class="shadcn-input" type="text" value="tijd, duur, feest"/>
</div>
</div>
</div>
<div class="space-y-6">
<div class="flex items-center gap-2 pb-2 border-b border-slate-100 dark:border-slate-800">
<span class="material-symbols-outlined text-blue-600 text-[20px]">psychology</span>
<h2 class="text-sm font-semibold text-slate-900 dark:text-white uppercase tracking-wider">Context &amp; Learning</h2>
</div>
<div class="space-y-4">
<div class="space-y-1.5">
<label class="label-sm">Mnemonic / AI Hint</label>
<input class="shadcn-input h-11" type="text" value="night sky clock"/>
</div>
<div class="space-y-1.5">
<label class="label-sm">Example Sentence (Javanese)</label>
<textarea class="shadcn-textarea" rows="2">Kita jogètan sewengi muput.</textarea>
</div>
<div class="space-y-1.5">
<label class="label-sm">Example Sentence (Dutch)</label>
<textarea class="shadcn-textarea italic text-slate-600 dark:text-slate-400" rows="2">We dansten de hele nacht lang.</textarea>
</div>
<div class="space-y-1.5">
<label class="label-sm">Linguistic Notes</label>
<textarea class="shadcn-textarea min-h-[140px] text-slate-600 dark:text-slate-400 leading-relaxed">'Muput' betekent 'volledig'. Het wordt vaak gebruikt in de context van tijd om aan te geven dat iets de gehele duur in beslag nam. In Ngoko-context is het informeler maar veelgebruikt in dagelijkse spraak.</textarea>
</div>
</div>
</div>
</div>
</div>
<div class="relative p-6 border-t border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/50 flex justify-between items-center">
<button class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100 transition-colors">
                Cancel Changes
            </button>
<div class="flex gap-3">
<button class="px-6 py-2 bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-sm font-medium text-slate-900 dark:text-white rounded-md hover:bg-slate-50 dark:hover:bg-slate-900 transition-colors">
                    Draft Save
                </button>
<button class="px-8 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-md shadow-sm transition-all active:scale-[0.98]">
                    Store Vocabulary
                </button>
</div>
</div>
</div>
<button class="fixed bottom-6 right-6 h-10 w-10 flex items-center justify-center bg-white dark:bg-slate-900 rounded-full shadow-lg border border-slate-200 dark:border-slate-800 z-50 text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors" onclick="document.documentElement.classList.toggle('dark')">
<span class="material-symbols-outlined dark:hidden">dark_mode</span>
<span class="material-symbols-outlined hidden dark:block">light_mode</span>
</button>

</body></html>
